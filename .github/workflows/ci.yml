name: CI

on:
  push:
    branches-ignore:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DEPENDENCIES: g++ ninja-build pkg-config dpkg-dev libgtkmm-4.0-dev libsigc++-3.0-dev libcurl4-openssl-dev

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DEPENDENCIES

      # cmake_minimum_required(VERSION 4.2) is newer than the CMake shipped with Ubuntu.
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTAPIK_MEDIA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version and main
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -nE 's/^project\(stapikmedia VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)

          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version '$project_version' in CMakeLists.txt"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

          echo "VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DEPENDENCIES

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          (cd build && cpack -G DEB)
          cp build/stapikmedia_*.deb .
          sha256sum stapikmedia_*.deb > "stapikmedia_${VERSION}.deb.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stapikmedia-${{ env.VERSION }}-deb
          path: |
            stapikmedia_*.deb
            stapikmedia_${{ env.VERSION }}.deb.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stapikmedia_*.deb
            stapikmedia_${{ env.VERSION }}.deb.sha256
